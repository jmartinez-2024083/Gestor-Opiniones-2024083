services:
  postgres:
    image: postgres:13
    container_name: GestorOpiniones
    environment:
      POSTGRES_USER: GestorOpiniones
      POSTGRES_PASSWORD: GestorOpiniones
      POSTGRES_DB: GestorOpiniones
    ports:
      - "5437:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: